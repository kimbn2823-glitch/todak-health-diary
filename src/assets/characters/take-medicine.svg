<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170" width="120" height="170" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <style>
    /* 알약 든 팔을 입 쪽으로 들어올리기 */
    .lift { animation: tmLift 1.8s ease-in-out infinite; transform-origin: 75px 82px; }
    @keyframes tmLift { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-11deg); } }
    /* 물컵 살짝 찰랑 */
    .cup { animation: tmCup 1.8s ease-in-out infinite 0.2s; transform-origin: 31px 96px; }
    @keyframes tmCup { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(3.5deg); } }
    .blink { animation: tmBlink 4.2s ease-in-out infinite; transform-origin: center; }
    @keyframes tmBlink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.2); } }
    @media (prefers-reduced-motion: reduce) { .lift,.cup,.blink { animation: none; } }
  </style>

  <!-- 약과 물컵을 든 캐릭터 -->
  <circle cx="60" cy="84" r="46" fill="#eaf6fd"/>
  <!-- 다리 -->
  <path d="M53 116 L51 146" stroke="#3a3a3a" stroke-width="12"/>
  <path d="M67 116 L69 146" stroke="#3a3a3a" stroke-width="12"/>
  <rect x="42" y="145" width="19" height="10" rx="5" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.4"/>
  <rect x="59" y="145" width="19" height="10" rx="5" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.4"/>
  <!-- 물컵 든 팔 (왼쪽) -->
  <path d="M45 82 L31 96" stroke="#ffe0cc" stroke-width="10"/>
  <g class="cup">
    <path d="M22 92h16l-2 16a3 3 0 0 1-3 2.6h-6a3 3 0 0 1-3-2.6Z" fill="#cbe7f7" stroke="#3a3a3a" stroke-width="2.4"/>
    <path d="M24 99h12" stroke="#7cc6e8" stroke-width="2.4"/>
  </g>
  <!-- 약 든 팔 (오른쪽, 위로) -->
  <g class="lift">
    <path d="M75 80 L88 62" stroke="#ffe0cc" stroke-width="10"/>
    <circle cx="90" cy="58" r="6.5" fill="#ffe0cc" stroke="#3a3a3a" stroke-width="2.4"/>
    <!-- 알약 -->
    <g transform="rotate(-35 90 44)">
      <path d="M82 39h16a5.5 5.5 0 0 1 0 11H82a5.5 5.5 0 0 1 0-11Z" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.4"/>
      <path d="M90 39h8a5.5 5.5 0 0 1 0 11h-8Z" fill="#f08b8b" stroke="#3a3a3a" stroke-width="2.4"/>
    </g>
  </g>
  <!-- 몸통 -->
  <path d="M44 78c0-6 7-10 16-10s16 4 16 10v28c0 5-6 8-16 8s-16-3-16-8Z" fill="#7cc6e8" stroke="#3a3a3a" stroke-width="2.6"/>
  <!-- 목 -->
  <path d="M60 62v8" stroke="#ffe0cc" stroke-width="9"/>
  <!-- 머리 -->
  <circle cx="60" cy="44" r="19" fill="#ffe0cc" stroke="#3a3a3a" stroke-width="2.6"/>
  <!-- 머리카락 + 올림머리 -->
  <path d="M41 42c0-12 8-21 19-21s19 9 19 21c-3-5-8-8-19-8s-16 3-19 8Z" fill="#4a3728"/>
  <circle cx="60" cy="18" r="7.5" fill="#4a3728" stroke="#3a3a3a" stroke-width="2"/>
  <!-- 얼굴 -->
  <g class="blink">
    <path d="M49 44c1.6-2.4 4.4-2.4 6 0" stroke="#3a3a3a" stroke-width="2.4"/>
    <path d="M65 44c1.6-2.4 4.4-2.4 6 0" stroke="#3a3a3a" stroke-width="2.4"/>
  </g>
  <ellipse cx="60" cy="52" rx="3.4" ry="3" fill="#3a3a3a"/>
  <circle cx="45" cy="50" r="3.2" fill="#ffb3b3" opacity="0.75"/>
  <circle cx="75" cy="50" r="3.2" fill="#ffb3b3" opacity="0.75"/>
</svg>
