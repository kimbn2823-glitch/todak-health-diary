<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170" width="120" height="170" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <style>
    /* 연필 사각사각 */
    .pen { animation: wlPen 0.9s ease-in-out infinite; transform-origin: 85px 99px; }
    @keyframes wlPen { 0%,100% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(-7deg) translateY(1px); } }
    /* 공책 살짝 들썩 */
    .note { animation: wlNote 0.9s ease-in-out infinite; }
    @keyframes wlNote { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
    /* 눈 깜빡임 */
    .blink { animation: wlBlink 4s ease-in-out infinite; transform-origin: center; }
    @keyframes wlBlink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.15); } }
    @media (prefers-reduced-motion: reduce) { .pen,.note,.blink { animation: none; } }
  </style>

  <!-- 식단을 기록하는 캐릭터 -->
  <circle cx="60" cy="84" r="46" fill="#e2f4ea"/>
  <!-- 다리 -->
  <path d="M53 116 L51 146" stroke="#2d3142" stroke-width="12"/>
  <path d="M67 116 L69 146" stroke="#2d3142" stroke-width="12"/>
  <rect x="42" y="145" width="19" height="10" rx="5" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.4"/>
  <rect x="59" y="145" width="19" height="10" rx="5" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.4"/>
  <!-- 몸통 -->
  <path d="M44 78c0-6 7-10 16-10s16 4 16 10v28c0 5-6 8-16 8s-16-3-16-8Z" fill="#7ac74f" stroke="#3a3a3a" stroke-width="2.6"/>
  <!-- 공책 든 왼팔 -->
  <path d="M46 84 L34 96" stroke="#ffe0cc" stroke-width="10"/>
  <g class="note">
    <rect x="16" y="88" width="30" height="34" rx="4" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.6"/>
    <path d="M22 98h18M22 106h14M22 114h10" stroke="#93a9da" stroke-width="2.4"/>
  </g>
  <!-- 연필 든 오른팔 -->
  <path d="M74 84 L84 96" stroke="#ffe0cc" stroke-width="10"/>
  <g class="pen">
    <circle cx="85" cy="99" r="6" fill="#ffe0cc" stroke="#3a3a3a" stroke-width="2.4"/>
    <g transform="rotate(38 88 92)">
      <rect x="83" y="72" width="8" height="24" rx="2" fill="#ffd166" stroke="#3a3a3a" stroke-width="2.2"/>
      <path d="M83 96h8l-4 7Z" fill="#ffe0cc" stroke="#3a3a3a" stroke-width="2.2"/>
      <rect x="83" y="70" width="8" height="5" rx="1.6" fill="#f08b8b" stroke="#3a3a3a" stroke-width="2.2"/>
    </g>
  </g>
  <!-- 목 -->
  <path d="M60 62v8" stroke="#ffe0cc" stroke-width="9"/>
  <!-- 머리 -->
  <circle cx="60" cy="44" r="19" fill="#ffe0cc" stroke="#3a3a3a" stroke-width="2.6"/>
  <!-- 단발 머리 -->
  <path d="M41 44c0-13 8-22 19-22s19 9 19 22v6c-2-4-3-11-4-14-4 4-10 5-15 5s-11-1-15-5c-1 3-2 10-4 14Z" fill="#2d3142"/>
  <!-- 집중한 표정 -->
  <g class="blink">
    <circle cx="52" cy="46" r="2.4" fill="#3a3a3a"/>
    <circle cx="68" cy="46" r="2.4" fill="#3a3a3a"/>
  </g>
  <path d="M57 53h6" stroke="#3a3a3a" stroke-width="2.2"/>
  <circle cx="45" cy="51" r="3.2" fill="#ffb3b3" opacity="0.75"/>
  <circle cx="75" cy="51" r="3.2" fill="#ffb3b3" opacity="0.75"/>
</svg>
