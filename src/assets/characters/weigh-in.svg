<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170" width="120" height="170" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <style>
    /* 체중계 바늘 흔들림 */
    .needle { animation: wiNeedle 1.8s ease-in-out infinite; transform-origin: 60px 152px; }
    @keyframes wiNeedle { 0%,100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg); } }
    /* 긴장해서 몸 살짝 갸웃 */
    .sway { animation: wiSway 2.6s ease-in-out infinite; transform-origin: 60px 140px; }
    @keyframes wiSway { 0%,100% { transform: rotate(-1.4deg); } 50% { transform: rotate(1.4deg); } }
    /* 팔 함께 살랑 */
    .arm-l { animation: wiArmL 2.6s ease-in-out infinite; transform-origin: 45px 82px; }
    .arm-r { animation: wiArmR 2.6s ease-in-out infinite; transform-origin: 75px 82px; }
    @keyframes wiArmL { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @keyframes wiArmR { 0%,100% { transform: rotate(4deg); } 50% { transform: rotate(-4deg); } }
    .blink { animation: wiBlink 4.4s ease-in-out infinite; transform-origin: center; }
    @keyframes wiBlink { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.15); } }
    @media (prefers-reduced-motion: reduce) { .needle,.sway,.arm-l,.arm-r,.blink { animation: none; } }
  </style>

  <!-- 체중계에 올라선 캐릭터 -->
  <circle cx="60" cy="84" r="46" fill="#e5f0fb"/>
  <g class="sway">
    <!-- 다리 -->
    <path d="M53 116 L52 140" stroke="#5aa9e6" stroke-width="12"/>
    <path d="M67 116 L68 140" stroke="#5aa9e6" stroke-width="12"/>
    <!-- 팔 (아래로, 살짝 벌림) -->
    <g class="arm-l">
      <path d="M45 82 L34 104" stroke="#ffe0cc" stroke-width="10"/>
      <circle cx="33" cy="107" r="6" fill="#ffe0cc" stroke="#3a3a3a" stroke-width="2.4"/>
    </g>
    <g class="arm-r">
      <path d="M75 82 L86 104" stroke="#ffe0cc" stroke-width="10"/>
      <circle cx="87" cy="107" r="6" fill="#ffe0cc" stroke="#3a3a3a" stroke-width="2.4"/>
    </g>
    <!-- 몸통 -->
    <path d="M44 78c0-6 7-10 16-10s16 4 16 10v28c0 5-6 8-16 8s-16-3-16-8Z" fill="#ffd166" stroke="#3a3a3a" stroke-width="2.6"/>
    <!-- 목 -->
    <path d="M60 62v8" stroke="#ffe0cc" stroke-width="9"/>
    <!-- 머리 -->
    <circle cx="60" cy="44" r="19" fill="#ffe0cc" stroke="#3a3a3a" stroke-width="2.6"/>
    <!-- 머리카락 -->
    <path d="M41 44c0-13 8-22 19-22s19 9 19 22c-2-6-5-9-8-10-4 3-8 4-11 4-5 0-10-1-13-4-3 2-5 5-6 10Z" fill="#2d3142"/>
    <!-- 아래를 내려다보는 눈 -->
    <g class="blink">
      <circle cx="52" cy="47" r="2.4" fill="#3a3a3a"/>
      <circle cx="68" cy="47" r="2.4" fill="#3a3a3a"/>
    </g>
    <path d="M57 54c1.8 1.6 4.2 1.6 6 0" stroke="#3a3a3a" stroke-width="2.2"/>
    <circle cx="45" cy="51" r="3.2" fill="#ffb3b3" opacity="0.75"/>
    <circle cx="75" cy="51" r="3.2" fill="#ffb3b3" opacity="0.75"/>
  </g>
  <!-- 체중계 -->
  <rect x="30" y="140" width="60" height="17" rx="6" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.6"/>
  <rect x="47" y="145" width="26" height="8" rx="3" fill="#e5f0fb" stroke="#3a3a3a" stroke-width="2.2"/>
  <path class="needle" d="M60 152l0 -5.5" stroke="#f08b8b" stroke-width="2.4"/>
</svg>
