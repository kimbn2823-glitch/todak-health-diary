<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170" width="120" height="170" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <style>
    /* 만세 팔 흔들기 */
    .arm-l { animation: chArmL 1.1s ease-in-out infinite; transform-origin: 45px 80px; }
    .arm-r { animation: chArmR 1.1s ease-in-out infinite 0.1s; transform-origin: 75px 80px; }
    @keyframes chArmL { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(14deg); } }
    @keyframes chArmR { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-14deg); } }
    /* 기뻐서 폴짝 */
    .jump { animation: chJump 1.1s ease-in-out infinite; }
    @keyframes chJump { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    /* 색종이 반짝 */
    .cf1 { animation: chTw 1.6s ease-in-out infinite; transform-origin: center; }
    .cf2 { animation: chTw 1.6s ease-in-out infinite 0.4s; transform-origin: center; }
    .cf3 { animation: chTw 1.6s ease-in-out infinite 0.8s; transform-origin: center; }
    .cf4 { animation: chTw 1.6s ease-in-out infinite 1.2s; transform-origin: center; }
    @keyframes chTw { 0%,100% { opacity: 0.4; transform: scale(0.85) rotate(0deg); } 50% { opacity: 1; transform: scale(1.15) rotate(14deg); } }
    @media (prefers-reduced-motion: reduce) { .arm-l,.arm-r,.jump,.cf1,.cf2,.cf3,.cf4 { animation: none; } }
  </style>

  <!-- 목표 달성을 축하하는 캐릭터 -->
  <circle cx="60" cy="84" r="46" fill="#fff3d6"/>
  <!-- 색종이 -->
  <rect class="cf1" x="18" y="26" width="7" height="7" rx="1.6" fill="#f08b8b" transform="rotate(-24 21 29)"/>
  <rect class="cf2" x="96" y="34" width="7" height="7" rx="1.6" fill="#5aa9e6" transform="rotate(30 99 37)"/>
  <rect class="cf3" x="30" y="120" width="6" height="6" rx="1.4" fill="#ffd166" transform="rotate(18 33 123)"/>
  <rect class="cf4" x="86" y="118" width="6" height="6" rx="1.4" fill="#7ac74f" transform="rotate(-14 89 121)"/>
  <path class="cf2" d="M14 62l1.6 4.2 4.2 1.6-4.2 1.6L14 74l-1.6-4.6-4.2-1.6 4.2-1.6Z" fill="#ffd166"/>
  <path class="cf4" d="M106 76l1.4 3.8 3.8 1.4-3.8 1.4-1.4 3.8-1.4-3.8-3.8-1.4 3.8-1.4Z" fill="#f08b8b"/>
  <!-- 다리 (기뻐서 살짝 벌림) -->
  <path d="M53 116 L46 145" stroke="#f08b8b" stroke-width="12"/>
  <path d="M67 116 L74 145" stroke="#f08b8b" stroke-width="12"/>
  <rect x="36" y="144" width="19" height="10" rx="5" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.4"/>
  <rect x="65" y="144" width="19" height="10" rx="5" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.4"/>
  <!-- 만세 팔 -->
  <g class="arm-l">
    <path d="M45 80 L30 52" stroke="#ffe0cc" stroke-width="10"/>
    <circle cx="28" cy="48" r="6.5" fill="#ffe0cc" stroke="#3a3a3a" stroke-width="2.4"/>
  </g>
  <g class="arm-r">
    <path d="M75 80 L90 52" stroke="#ffe0cc" stroke-width="10"/>
    <circle cx="92" cy="48" r="6.5" fill="#ffe0cc" stroke="#3a3a3a" stroke-width="2.4"/>
  </g>
  <g class="jump">
    <!-- 몸통 -->
    <path d="M44 78c0-6 7-10 16-10s16 4 16 10v28c0 5-6 8-16 8s-16-3-16-8Z" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.6"/>
    <!-- 목 -->
    <path d="M60 62v8" stroke="#ffe0cc" stroke-width="9"/>
    <!-- 머리 -->
    <circle cx="60" cy="44" r="19" fill="#ffe0cc" stroke="#3a3a3a" stroke-width="2.6"/>
    <!-- 머리카락 -->
    <path d="M41 44c0-13 8-22 19-22s19 9 19 22c-2-6-5-9-8-10-4 3-8 4-11 4-5 0-10-1-13-4-3 2-5 5-6 10Z" fill="#2d3142"/>
    <!-- 신난 표정 (^^ 눈 + 벌린 입) -->
    <path d="M48 45c1.8-2.8 5-2.8 6.8 0" stroke="#3a3a3a" stroke-width="2.4"/>
    <path d="M65.2 45c1.8-2.8 5-2.8 6.8 0" stroke="#3a3a3a" stroke-width="2.4"/>
    <ellipse cx="60" cy="53" rx="4.6" ry="4" fill="#3a3a3a"/>
    <circle cx="44" cy="51" r="3.4" fill="#ffb3b3" opacity="0.8"/>
    <circle cx="76" cy="51" r="3.4" fill="#ffb3b3" opacity="0.8"/>
  </g>
</svg>
