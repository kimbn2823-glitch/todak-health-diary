<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170" width="120" height="170" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <style>
    /* 이불이 숨 쉬듯 오르내림 */
    .breathe { animation: breathe 3.4s ease-in-out infinite; transform-origin: 60px 120px; }
    @keyframes breathe {
      0%, 100% { transform: scaleY(1); }
      50%      { transform: scaleY(1.035); }
    }
    /* Z 가 떠오름 */
    .z1 { animation: zfloat 3s ease-in-out infinite; }
    .z2 { animation: zfloat 3s ease-in-out infinite 0.6s; }
    .z3 { animation: zfloat 3s ease-in-out infinite 1.2s; }
    @keyframes zfloat {
      0%   { opacity: 0;   transform: translate(0, 4px) scale(0.7); }
      35%  { opacity: 1;   transform: translate(3px, -4px) scale(1); }
      100% { opacity: 0;   transform: translate(7px, -14px) scale(1.15); }
    }
    @media (prefers-reduced-motion: reduce) {
      .breathe, .z1, .z2, .z3 { animation: none; }
      .z1, .z2, .z3 { opacity: 1; }
    }
  </style>

  <!-- 잠자는 캐릭터 -->
  <circle cx="60" cy="90" r="46" fill="#e5eefb"/>

  <!-- 침대 매트리스 -->
  <rect x="14" y="112" width="92" height="12" rx="5" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.6"/>
  <!-- 침대 다리 -->
  <path d="M22 124v9M98 124v9" stroke="#3a3a3a" stroke-width="3"/>
  <!-- 헤드보드 -->
  <path d="M14 112V92a5 5 0 0 1 5-5h6a5 5 0 0 1 5 5v20" fill="#f0d9a8" stroke="#3a3a3a" stroke-width="2.6"/>

  <!-- 베개 -->
  <rect x="26" y="94" width="26" height="14" rx="6" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.4"/>

  <!-- 이불 -->
  <g class="breathe">
    <path d="M48 112c0-8 7-14 16-14h26a8 8 0 0 1 8 8v6Z" fill="#7cc6e8" stroke="#3a3a3a" stroke-width="2.6"/>
    <path d="M56 106c6-3 14-3 20 0" stroke="#ffffff" stroke-width="2.4" opacity="0.8"/>
  </g>

  <!-- 머리 -->
  <circle cx="45" cy="98" r="13" fill="#ffe0cc" stroke="#3a3a3a" stroke-width="2.6"/>
  <!-- 머리카락 -->
  <path d="M32 96c0-9 6-15 13-15s13 6 13 15c-2-4-4-6-6-7-3 2-5 3-8 3-4 0-7-1-9-3-1 1-2 3-3 7Z" fill="#2d3142"/>
  <!-- 감은 눈 + 편안한 입 -->
  <path d="M38 98c1.4 1.6 3.4 1.6 4.8 0" stroke="#3a3a3a" stroke-width="2.2"/>
  <path d="M48 98c1.4 1.6 3.4 1.6 4.8 0" stroke="#3a3a3a" stroke-width="2.2"/>
  <path d="M44 104c1.4 1 3 1 4.4 0" stroke="#3a3a3a" stroke-width="1.9"/>
  <circle cx="35" cy="102" r="2.8" fill="#ffb3b3" opacity="0.75"/>

  <!-- Z Z Z -->
  <g fill="#5b8fd4" font-family="Pretendard, system-ui, sans-serif" font-weight="800">
    <text class="z1" x="60" y="72" font-size="13">z</text>
    <text class="z2" x="70" y="60" font-size="16">z</text>
    <text class="z3" x="82" y="46" font-size="19">Z</text>
  </g>

  <!-- 달 -->
  <path d="M104 30c-6.6 0-12-5.4-12-12 0-1.4.2-2.7.7-3.9C87 16.4 84 21 84 26.4 84 33.9 90.1 40 97.6 40c4.8 0 9-2.5 11.4-6.2-1.5.5-3.2.2-5 .2Z" fill="#ffd166" stroke="#3a3a3a" stroke-width="2.4"/>
</svg>
