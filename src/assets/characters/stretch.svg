<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170" width="120" height="170" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <style>
    /* 양팔 스트레칭 — 위로 쭉 폈다가 돌아오기 */
    .arm-l { animation: stretchL 2.4s ease-in-out infinite; transform-origin: 46px 78px; }
    .arm-r { animation: stretchR 2.4s ease-in-out infinite; transform-origin: 74px 78px; }
    @keyframes stretchL {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(10deg); }
    }
    @keyframes stretchR {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-10deg); }
    }
    /* 몸통 살짝 늘어나는 느낌 */
    .body { animation: lift 2.4s ease-in-out infinite; transform-origin: 60px 112px; }
    @keyframes lift {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-3px); }
    }
    .blink { animation: blink 4.5s ease-in-out infinite; transform-origin: center; }
    @keyframes blink {
      0%, 93%, 100% { transform: scaleY(1); }
      96%           { transform: scaleY(0.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .arm-l, .arm-r, .body, .blink { animation: none; }
    }
  </style>

  <!-- 스트레칭하는 캐릭터 -->
  <circle cx="60" cy="86" r="46" fill="#ffe4e4"/>
  <!-- 올린 팔 -->
  <g class="arm-l">
    <path d="M46 78 L30 48" stroke="#ffe0cc" stroke-width="11"/>
    <circle cx="29" cy="45" r="6.5" fill="#ffe0cc" stroke="#3a3a3a" stroke-width="2.4"/>
  </g>
  <g class="arm-r">
    <path d="M74 78 L90 48" stroke="#ffe0cc" stroke-width="11"/>
    <circle cx="91" cy="45" r="6.5" fill="#ffe0cc" stroke="#3a3a3a" stroke-width="2.4"/>
  </g>
  <!-- 다리 -->
  <path d="M53 116 L50 146" stroke="#f08b8b" stroke-width="12"/>
  <path d="M67 116 L70 146" stroke="#f08b8b" stroke-width="12"/>
  <rect x="41" y="145" width="19" height="10" rx="5" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.4"/>
  <rect x="60" y="145" width="19" height="10" rx="5" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.4"/>

  <g class="body">
    <!-- 몸통 -->
    <path d="M45 76c0-6 6-10 15-10s15 4 15 10v28c0 5-5 8-15 8s-15-3-15-8Z" fill="#ffffff" stroke="#3a3a3a" stroke-width="2.6"/>
    <!-- 목 -->
    <path d="M60 60v8" stroke="#ffe0cc" stroke-width="9"/>
    <!-- 머리 -->
    <circle cx="60" cy="42" r="19" fill="#ffe0cc" stroke="#3a3a3a" stroke-width="2.6"/>
    <!-- 머리카락 + 올림머리 -->
    <path d="M41 40c0-12 8-21 19-21s19 9 19 21c-3-5-8-8-19-8s-16 3-19 8Z" fill="#2d3142"/>
    <circle cx="60" cy="16" r="8" fill="#2d3142" stroke="#3a3a3a" stroke-width="2"/>
    <!-- 얼굴 -->
    <g class="blink">
      <circle cx="52" cy="43" r="2.4" fill="#3a3a3a"/>
      <circle cx="68" cy="43" r="2.4" fill="#3a3a3a"/>
    </g>
    <path d="M56 50c2.4 2.2 5.6 2.2 8 0" stroke="#3a3a3a" stroke-width="2.2"/>
    <circle cx="45" cy="48" r="3.2" fill="#ffb3b3" opacity="0.75"/>
    <circle cx="75" cy="48" r="3.2" fill="#ffb3b3" opacity="0.75"/>
  </g>
</svg>
